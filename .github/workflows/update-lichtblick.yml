name: check-maintained-lichtblick-pin

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-maintained-lichtblick-pin
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify maintained source pin is current
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source lichtblick.lock

          remote_sha="$(git ls-remote --heads \
            "$LICHTBLICK_REPOSITORY" \
            "refs/heads/$LICHTBLICK_REF" |
            awk -v branch="refs/heads/$LICHTBLICK_REF" '$2 == branch {print $1}')"
          [[ "$remote_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Cannot resolve maintained branch $LICHTBLICK_REF." >&2
            exit 1
          }
          [[ "$remote_sha" == "$LICHTBLICK_SHA" ]] || {
            echo "Packaging pin is stale." >&2
            echo "Maintained branch: $LICHTBLICK_REPOSITORY@$LICHTBLICK_REF" >&2
            echo "Locked SHA:       $LICHTBLICK_SHA" >&2
            echo "Current SHA:      $remote_sha" >&2
            echo "Update lichtblick.lock and bump the Debian revision before release." >&2
            exit 1
          }

          echo "Packaging pin matches maintained source: $LICHTBLICK_SHA"
